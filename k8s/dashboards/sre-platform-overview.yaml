apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-platform-overview
  namespace: observability
  labels:
    grafana_dashboard: "1"

data:
  sre-platform-overview.json: |
    {
      "title": "SRE Platform Overview",
      "uid": "sre-platform-overview",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "type": "stat",
          "title": "Ready Nodes",
          "id": 1,
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0},
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Running Pods",
          "id": 2,
          "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0},
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{phase=\"Running\"})",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Cluster CPU Utilization",
          "id": 3,
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5},
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))",
              "legendFormat": "CPU",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Cluster Memory Utilization",
          "id": 4,
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5},
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "100 * (1 - (sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)))",
              "legendFormat": "Memory",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Pod Restarts - 15m",
          "id": 5,
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 13},
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total[15m]))",
              "legendFormat": "Restarts",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Node Network Traffic",
          "id": 6,
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 13},
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(node_network_receive_bytes_total{device!=\"lo\"}[5m]))",
              "legendFormat": "Received",
              "refId": "A"
            },
            {
              "expr": "sum(rate(node_network_transmit_bytes_total{device!=\"lo\"}[5m]))",
              "legendFormat": "Transmitted",
              "refId": "B"
            }
          ]
        }
      ]
    }
