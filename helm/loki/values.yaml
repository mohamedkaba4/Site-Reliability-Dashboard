deploymentMode: Monolithic

loki:
  podLabels:
    azure.workload.identity/use: "true"

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: azure
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: azure
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
    azure:
      accountName: stmavencrestlokiprod
      useFederatedToken: true

  limits_config:
    retention_period: 168h

  compactor:
    retention_enabled: true
    delete_request_store: azure

serviceAccount:
  create: true
  name: loki
  annotations:
    azure.workload.identity/client-id: "4671969c-6683-480c-b8c2-93a940687d79"

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

minio:
  enabled: false

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
